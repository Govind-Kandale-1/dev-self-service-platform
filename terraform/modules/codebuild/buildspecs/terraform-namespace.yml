version: 0.2

phases:
  install:
    commands:
      - curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o tf.zip
      - unzip -q tf.zip && mv terraform /usr/local/bin/
      - curl -fsSL https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
      - chmod +x /usr/local/bin/kubectl
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

  build:
    commands:
      - |
        cat > namespace.tf <<EOF
        module "namespace" {
          source        = "git::https://github.com/Govind-Kandale-1/dev-self-service-platform.git//terraform/modules/eks-namespace"
          env_id        = "$ENV_ID"
          team          = "$TEAM"
          project       = "$PROJECT"
          cpu_limit     = "$CPU_LIMIT"
          memory_limit  = "$MEMORY_LIMIT"
        }
        EOF
      - |
        cat > backend.tf <<EOF
        terraform {
          backend "s3" {
            bucket = "$TF_STATE_BUCKET"
            key    = "namespaces/$ENV_ID/terraform.tfstate"
            region = "$AWS_REGION"
          }
        }
        EOF
      - terraform init -input=false
      - terraform apply -auto-approve -input=false

  post_build:
    commands:
      - echo "Namespace $ENV_ID provisioned"
